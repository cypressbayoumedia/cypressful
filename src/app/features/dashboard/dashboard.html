<div class="flex flex-col h-screen bg-slate-900 text-slate-100 w-full mx-auto shadow-2xl relative overflow-hidden bg-noise">
  @if (isDragging()) {
    <div class="absolute inset-0 z-[100] bg-emerald-900/80 backdrop-blur-sm flex items-center justify-center border-4 border-dashed border-emerald-400 m-4 rounded-xl pointer-events-none">
      <div class="text-emerald-100 flex flex-col items-center gap-4 animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-20 h-20 text-emerald-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
        <h2 class="text-3xl font-bold">Drop File to Upload</h2>
      </div>
    </div>
  }

  <!-- Header -->
  <app-dashboard-header
    [user]="user()"
    [currentSpace]="currentSpace()"
    [spaces]="spaces()"
    [isReady]="contentfulService.isReady()"
    [showSpaceMenu]="showSpaceMenu()"
    (toggleSpaceMenu)="showSpaceMenu.set(!showSpaceMenu())"
    (selectSpace)="onSelectSpace($event)"
    (openEntries)="openEntriesPanel()"
    (openMedia)="openMediaPanel()"
    (toggleModels)="showModelsPanel.set(!showModelsPanel())"
    (openPowerTools)="openPowerTools()"
    (logoutClicked)="logout()"
  />

  <!-- Content Models Overlay Panel -->
  <app-content-models-panel
    [show]="showModelsPanel()"
    [contentTypes]="contentfulService.contentTypes()"
    (closed)="showModelsPanel.set(false)"
    (selected)="onSelectTemplate($event); showModelsPanel.set(false)"
  />

  <!-- Media Library Overlay Panel -->
  <app-media-library-panel
    [show]="showMediaPanel()"
    [assets]="contentfulService.assets()"
    [assetsLoading]="contentfulService.assetsLoading()"
    (closed)="showMediaPanel.set(false)"
    (deleteAsset)="onDeleteAsset($event)"
    (renameAsset)="onRenameAsset($event)"
    (uploadAsset)="uploadNewMedia($event)"
  />

  <!-- Entries Panel Overlay -->
  <app-entries-panel
    [show]="showEntriesPanel()"
    [entries]="contentfulService.entries()"
    [contentTypes]="contentfulService.contentTypes()"
    [entriesLoading]="contentfulService.entriesLoading()"
    (closed)="showEntriesPanel.set(false)"
    (editEntry)="loadEntryForEdit($event)"
    (unpublishEntry)="unpublishEntryFromPanel($event)"
    (deleteEntry)="deleteEntryFromPanel($event)"
  />

  <!-- Asset Picker Overlay (for Link fields) -->
  <app-asset-picker
    [show]="showAssetPicker()"
    [assets]="contentfulService.assets()"
    [assetsLoading]="contentfulService.assetsLoading()"
    (closed)="showAssetPicker.set(false); assetPickerTarget.set(null)"
    (assetsSelected)="selectAssetsForField($event)"
  />

  <app-entry-picker
    [show]="showEntryPicker()"
    [entries]="contentfulService.entries()"
    [contentTypes]="contentfulService.contentTypes()"
    [entriesLoading]="contentfulService.entriesLoading()"
    [allowedContentTypes]="entryPickerTarget()?.allowedContentTypes || []"
    (closed)="showEntryPicker.set(false)"
    (entriesSelected)="selectEntriesForField($event)"
    (createNew)="createNewEntryFromPicker($event)"
  />

  <!-- Power Tools Overlay Panel -->
  <app-power-tools-panel
    [show]="showPowerTools()"
    (closed)="showPowerTools.set(false)"
    (uploadConverted)="uploadConvertedFile($event)"
    (uploadBulk)="uploadBulkFiles($event)"
  />

  <!-- Main Entry View -->
  <main class="flex-1 overflow-y-auto p-4 md:px-8 lg:px-12 pb-24">
    @if (activeEntryMessage(); as activeMsg) {
      <div class="max-w-4xl mx-auto w-full animate-fade-in-up">
        <app-entry-card
          [message]="activeMsg"
          [isLoading]="false"
          [assets]="contentfulService.assets()"
          [entries]="contentfulService.entries()"
          (save)="saveActiveEntry()"
          (publish)="publishActiveEntry()"
          (unpublish)="unpublishActiveEntry()"
          (deleteEntry)="deleteActiveEntry()"
          (updateField)="updateActiveCardField($event)"
          (openAssetPicker)="openAssetPickerForField($event)"
          (clearAsset)="clearAssetField($event)"
          (openEntryPicker)="openEntryPickerForField($event)"
          (editEntryLink)="editLinkedEntry($event)"
          (duplicate)="duplicateActiveEntry()"
          (closeCard)="activeEntry.set(null)"
        />
      </div>
    } @else {
      <!-- Empty Dashboard State -->
      <div class="h-full flex flex-col items-center justify-center text-center animate-fade-in-up mt-10">
        <div class="w-32 h-32 rounded-full bg-slate-800/50 shadow-2xl flex items-center justify-center mb-8 border border-slate-700/50">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-emerald-400 opacity-80">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
          </svg>
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 tracking-tight">Cypressful</h1>
        <p class="text-lg text-slate-400 max-w-lg mx-auto leading-relaxed mb-10">
          Select an entry from your library or create a new content model to begin editing.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <button (click)="openEntriesPanel()" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/20 transition-all hover:scale-105 active:scale-95 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
              <path fill-rule="evenodd" d="M2.628 1.601C5.028 1.206 7.49 1 10 1s4.973.206 7.372.601a.75.75 0 01.628.74v2.288a2.25 2.25 0 01-.659 1.59l-4.682 4.683a2.25 2.25 0 00-.659 1.59v3.018a.75.75 0 01-.363.639l-2.5 1.5a.75.75 0 01-1.137-.64v-4.517a2.25 2.25 0 00-.659-1.59L2.659 6.22A2.25 2.25 0 012 4.629V2.34a.75.75 0 01.628-.74z" clip-rule="evenodd" />
            </svg>
            Browse Entries
          </button>
          <button (click)="showModelsPanel.set(true)" class="px-8 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold rounded-xl shadow-lg transition-all hover:scale-105 active:scale-95 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
              <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z" />
            </svg>
            Create New
          </button>
        </div>
      </div>
    }
  </main>

  <!-- Floating AI Assistant -->
  <app-entry-assistant
    [show]="showAssistant()"
    [focusedEntry]="activeEntry()?.data"
    [focusedContentType]="activeEntry()?.contentType"
    (toggleAssistant)="showAssistant.set(!showAssistant())"
    (openEntry)="onAssistantOpenEntry($event)"
  />

  @if (!showAssistant()) {
    <button (click)="showAssistant.set(true)" class="fixed bottom-6 right-6 p-4 bg-emerald-500 text-white rounded-full shadow-2xl shadow-emerald-500/20 hover:bg-emerald-400 hover:scale-110 active:scale-95 transition-all z-40 focus:outline-none focus:ring-4 focus:ring-emerald-500/30 group">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7">
        <path fill-rule="evenodd" d="M9 4.5a.75.75 0 01.721.544l.813 2.846a3.75 3.75 0 002.577 2.576l2.846.813a.75.75 0 010 1.442l-2.846.813a3.75 3.75 0 00-2.576 2.577l-.813 2.846a.75.75 0 01-1.442 0l-.813-2.846a3.75 3.75 0 00-2.577-2.576l-2.846-.813a.75.75 0 010-1.442l2.846-.813A3.75 3.75 0 007.466 7.89l.813-2.846A.75.75 0 019 4.5zM18 1.5a.75.75 0 01.728.568l.258 1.036c.236.94.97 1.674 1.91 1.91l1.036.258a.75.75 0 010 1.456l-1.036.258c-.94.236-1.674.97-1.91 1.91l-.258 1.036a.75.75 0 01-1.456 0l-.258-1.036a2.625 2.625 0 00-1.91-1.91l-1.036-.258a.75.75 0 010-1.456l1.036-.258a2.625 2.625 0 001.91-1.91l.258-1.036A.75.75 0 0118 1.5z" clip-rule="evenodd" />
      </svg>
      <span class="absolute right-full mr-4 bg-slate-800 text-white text-xs px-2 py-1 rounded shadow-lg border border-slate-700 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">AI Assistant</span>
    </button>
  }
</div>
